project:
  type: website
  preview:
    port: 7633
    browser: true
    watch-inputs: true
    navigate: true
  resources:
    - "images/favicons/*"
    - "images/index.html"
    - "pdf/index.html"
    - "pdf/teaching/index.html"
    - "pdf/research/index.html"
    # Things that need to be at the site root
    - "site.webmanifest"
    - "browserconfig.xml"
    - "keybase.txt"

website:
  title: "dfolio' website"
  description: "D. Folio is an associate professor (HDR) at INSA Centre Val de Loire, researching in microrobotics."
  favicon: favicon.webp
  #site-url: http://dfolio.free.fr
  site-url: https://dfolio.quarto.pub
  repo-url: https://github.com/dfolio/dfolio-website
  search: true

  cookie-consent:
    style: simple
    type: implied
    palette: dark
    policy-url: about/privacy.qmd

  google-analytics:
    tracking-id: 'G-P49B92C60B'
    version: 4
    anonymize-ip: true

  open-graph:
    locale: en_US
    site-name: "{{< meta website.title >}}"
    image: /images/logo-df.webp

  reader-mode: true
  page-navigation: true

  page-footer:
    border: false
    left: |
        [&copy; 2004&ndash;2023, {{< fa at >}} [Folio David](/about/about.qmd).]{.copyright aria-label="copyright"}
        [![](https://i.creativecommons.org/l/by/4.0/80x15.png "Creative Commons License")](http://creativecommons.org/licenses/by/4.0/ "Creative Commons Attribution 4.0 International (CC BY 4.0)")
        Site licensed under
        [[{{< fa brands creative-commons-by >}} CC-BY 4.0](/about/license.qmd "Creative Commons Attribution 4.0 International (CC BY 4.0)")]{.license aria-label="license"}

    right:
      - aria-label: "GitHub"
        icon: github
        href:  https://github.com/dfolio
      - aria-label: "Orcid"
        text: "{{< ai orcid >}}"
        href: https://orcid.org/0000-0001-9430-6091
      - aria-label: "clarivate (webofscience)"
        text: "{{< ai clarivate >}}"
        href: https://www.webofscience.com/wos/author/record/D-5808-2013
      - aria-label: "Scopus"
        text: "{{< ai scopus >}}"
        href: https://www.scopus.com/authid/detail.uri?authorId=15924858900
      - aria-label: "Google Scholar"
        text: "{{< ai google-scholar >}}"
        href: https://scholar.google.fr/citations?user=XQVc6JMAAAAJ
      - aria-label: "Academia"
        text: "{{< ai academia >}}"
        href: https://insa-centrevaldeloire.academia.edu/DavidFolio
      - aria-label: "ResearchGate"
        text: "{{< ai researchgate >}}"
        href: https://www.researchgate.net/profile/David_Folio
      - aria-label: "LinkedIn"
        icon: linkedin
        href: https://www.linkedin.com/in/david-folio/
      - aria-label: "Viadeo"
        icon: link-45deg
        href: https://viadeo.com/fr/profile/david.folio
      - aria-label: "HAL"
        text: "{{< ai hal >}}"
        href: https://cv.hal.science/david-folio
#      - aria-label: "Website"
#        icon: link-45deg
#        href:  http://dfolio.free.fr

  navbar:
    pinned: false
    logo: favicon.webp
    logo-alt: "dfolio website logo"
    search: true
    title: false
    collapse-below: lg
    left:
      - text: "About"
        href: about/
      #- sidebar:teaching
      - text: "Teaching"
        href: teaching/teaching.qmd
      #- sidebar:research
      - text: "Research"
        href: research/
      - text: "References"
        href: research/references.qmd
    tools:
      - icon: save
        menu:
          - text: ""
            url:  "#"
      - icon: github
        href: https://github.com/dfolio
        text: Dfolio GitHub
  sidebar:
    - id: about
      #collapse-level: 1
      title: "Teaching"
      #style: "docked"
      style: "floating"
      contents:
        - about/about.qmd
        - about/dfolio.qmd
        - about/history.qmd
        - about/privacy.qmd
        - about/license.qmd


    - id: teaching
      #collapse-level: 1
      title: "Teaching"
      contents:
        - teaching/teaching.qmd
        - teaching/SFEN.qmd
        - teaching/ELAN.qmd
        - teaching/composants-electroniques.qmd
        - teaching/genie-electrique.qmd
        - teaching/signaux-systemes.qmd
        - teaching/diagnostic-systemes.qmd
        - teaching/advanced-robotic.qmd

    - id: research
      title: "Research"
      collapse-level: 2
      align: left
      contents:
        - research/research.qmd
        - research/supervisions.qmd
        - section: "Projects"
          contents:
          - text: "Projects list"
            href: research/projects/projects.qmd
          - research/projects/BUBBLEBOT.qmd
          - research/projects/MTG.qmd
        - section: "Microrobotics"
          contents:
          -  research/microrobotics/microrobotics.qmd
          - research/microrobotics/biomedical.qmd
        - section: Bibliography
          contents:
            - research/references.qmd
            - research/publications.qmd

format:
  html:
    date-modified: last-modified
    highlight: null
    mathjax: null
    theme:
      light: [scss/light.scss]
      dark: [scss/dark.scss]
    css: styles.css

    template: html/template.html
    template-partials:
      - html/metadata.html
      # - html/title-block.html
      - html/after-body.html
    toc: true
    anchor-sections: true
    code-copy: true
    #code-fold: true
    #code-line-numbers: true
    #code-link: true
    #code-overflow: wrap
    citations-hover: true
    link-citations: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/dfolio.(?:quarto.pub|free.fr)'
    footnotes-hover: true
    reference-location: document
    strip-comments: true
    smooth-scroll: true

page-layout: full
#bibliography: [research/references.bib]
csl: research/Thesis-ieee-style.csl

execute:
  freeze: auto
  echo: false
  message: false
  warning: false

author:
  name:
    family: Folio
    given: David
  orcid: 0000-0001-9430-6091
  email: david.folio@insa-cvl.fr
  url: http://dfolio.free.fr
  attributes:
    corresponding: true
    equal-contributor: true
  affiliations:
    - ref: INSA-CVL

affiliations:
  - id: INSA-CVL
    name: "INSA Centre Val de Loire"
    affiliation-url: https://www.insa-centrevaldeloire.fr/
    address: "88 Boulevard Lahitolle"
    postal-code: 18000
    city: Bourges
    country: France

# Metadata stuff
#pagetitle: "{{< meta title >}} | {{< meta website.title >}}"
title-prefix: "dfolio' website"
description-meta: "{{< meta description >}}"
author-meta: "D. FOLIO"
