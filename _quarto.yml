format:
  html:
#    author: "David FOLIO"
    theme:
      light: [cerulean, theme.scss]
      dark: [theme-dark.scss]
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    citations-hover: true
    link-citations: true
    link-external-newwindow: true
