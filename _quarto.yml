project:
  type: website
  preview:
    port: 7633
    browser: true
  resources:
    - "images/favicons/*"
    - "images/index.html"
    - "pdf/index.html"
    - "pdf/teaching/index.html"
    - "pdf/research/index.html"
    - "site.webmanifest"
    - "browserconfig.xml"

website:
  title: "dfolio website"
  description: "dfolio' personal website"
  favicon: favicon.webp
  #site-url: http://dfolio.free.fr
  site-url: https://dfolio.quarto.pub
  repo-url: https://github.com/dfolio/dfolio-free-website
  search: true

  cookie-consent:
    style: simple
    type: implied
    palette: dark
  google-analytics:
    tracking-id: 'G-P49B92C60B'
    version: 4
    anonymize-ip: true

  open-graph:
    locale: en_US
    site-name: "dfolio website"

  reader-mode: true
  page-navigation: true

  page-footer:
    left:
      - aria-label: copyright
        text: '&copy; 2004&ndash;2023, <i class="bi bi-at" role="img" aria-label="copyright"></i> Folio David. '
      - aria-label: license
        text: |
          Except where otherwise noted, all text and images licensed
          <span class="site-license" aria-label="license"
          <a rel="license" class="url" href="http://creativecommons.org/licenses/by/4.0/" title="Creative Commons Attribution 4.0 International (CC BY 4.0)"><i class="fab fa-creative-commons" aria-hidden="true"></i> BY 4.0</a>.
          </span>
    right:
      - aria-label: "Dfolio GitHub Page"
        icon: github
        href:  https://dfolio.github.io
      - aria-label: "Orcid"
        text: "{{< ai orcid >}}"
        href: https://orcid.org/0000-0001-9430-6091
      - aria-label: "clarivate (webofscience)"
        text: "{{< ai clarivate >}}"
        href: https://www.webofscience.com/wos/author/record/D-5808-2013
      - aria-label: "Scopus"
        text: "{{< ai scopus >}}"
        href: https://www.scopus.com/authid/detail.uri?authorId=15924858900
      - aria-label: "Google Scholar"
        text: "{{< ai google-scholar >}}"
        href: https://scholar.google.fr/citations?user=XQVc6JMAAAAJ
      - aria-label: "Academia"
        text: "{{< ai academia >}}"
        href: https://insa-centrevaldeloire.academia.edu/DavidFolio
      - aria-label: "ResearchGate"
        text: "{{< ai researchgate >}}"
        href: https://www.researchgate.net/profile/David_Folio
      - aria-label: "LinkedIn"
        icon: linkedin
        href: https://www.linkedin.com/in/david-folio/
      - aria-label: "Viadeo"
        icon: link-45deg
        href: https://viadeo.com/fr/profile/david.folio
      - aria-label: "HAL"
        text: "{{< ai hal >}}"
        href: https://cv.hal.science/david-folio
      - aria-label: "Website"
        icon: link-45deg
        href:  http://dfolio.free.fr

  navbar:
    logo: favicon.webp
    logo-alt: "dfolio website logo"
    left:
      - about.qmd
      #- sidebar:teaching
      - text: "Teaching"
        href: teaching.qmd
      #- sidebar:research
      - text: "Research"
        href: research.qmd
      - text: "References"
        href: research/references.qmd
  sidebar:
    - id: teaching
      #collapse-level: 1
      title: "Teaching"
      style: "docked"
      #style: "floating"
      contents:
        - teaching.qmd
        - teaching/SFEN.qmd
        - teaching/ELAN.qmd
        - teaching/composants-electroniques.qmd
        - teaching/genie-electrique.qmd
        - teaching/signaux-systemes.qmd
        - teaching/diagnostic-systemes.qmd
        - teaching/advanced-robotic.qmd

    - id: research
      title: "Research"
      collapse-level: 2
      align: left
      contents:
        - text: "Research activities"
          href: research.qmd
        - research/supervisions.qmd
        - section: "Projects"
          contents:
          - text: "Overview"
            href: research/projects/
          - research/projects/BUBBLEBOT.qmd
          - research/projects/MTG.qmd
        - section: "Microrobotics"
          contents:
          - text: "Overview"
            href: research/microrobotics/
          - research/microrobotics/biomedical.qmd
        - section: Bibliography
          contents:
            - research/references.qmd
            - research/publications.qmd

format:
  html:
    author: "David FOLIO"
#      - name: "David FOLIO"
#      - email: dfolio@gmail.com
#      - url: http://dfolio.free.fr
#      - affiliation: "INSA Centre Val de Loire"
#      - affiliation-url: https://www.insa-centrevaldeloire.fr/
    date-modified: last-modified
    #license: "CC BY"
    highlight: null
    mathjax: null
    theme:
      light: [cerulean, theme.scss]
      dark: [theme-dark.scss]
    css: styles.css

    template: template.html
    template-partials:
      - metadata.html
      - title-block.html
      - after-body.html
    toc: true
    code-copy: true
    code-overflow: wrap
    citations-hover: true
    link-citations: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/dfolio.(?:quarto.pub|free.fr)'
    footnotes-hover: true
    reference-location: document
    strip-comments: true
    grid:
      sidebar-width: 500px
      grid-body-width: 900px

page-layout: full
#bibliography: [research/references.bib]
csl: research/Thesis-ieee-style.csl

execute:
  freeze: auto

