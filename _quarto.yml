# Metadata stuff
title-prefix: *title
author-meta: "D. FOLIO"

lightbox:
  match: auto
  effect: zoom
  desc-position: bottom
  loop: true
  
format:
  html:
    minimal: true
    from: markdown+emoji
    date-modified: last-modified
    highlight: null
    mathjax: null
    canonical-url: true
    html-math-method: plain
    default-image-extension: webp
    toc: true
    anchor-sections: true
    code-copy: true
    citations-hover: true
    link-citations: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/dfolio.(?:quarto.pub|free.fr|fr)'
    crossrefs-hover: true
    footnotes-hover: true
    reference-location: document
    strip-comments: true
    smooth-scroll: true
    theme:
      light: [scss/common.scss,scss/light.scss]
      dark: [scss/common.scss,scss/dark.scss]

    #css: styles.css

    template: html/template.html
    template-partials:
      - html/metadata.html
      - html/title-block.html
      - html/title-metadata.html
      - html/title-metadata-author.html
      - html/after-body.html
      - html/json-author.html

#page-layout: full
#bibliography: [research/references.bib]
csl: research/Thesis-ieee-style.csl
#csl: /research/nature-no-et-al.csl
#biblio-style: ieee
#biblatex: true

execute:
  freeze: auto
  echo: false
  message: false
  warning: false
crossref:
  fig-title: Fig     # (default is "Figure")
  eq-title: Eq       # (default is "Equation")
  #tbl-title: Tbl     # (default is "Table")


