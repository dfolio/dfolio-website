project:
  type: website
  preview:
    port: 8080
    browser: true
    watch-inputs: true
    #navigate: true
  resources:
    - CNAME
    - netlify.toml
    - "favicon.svg"
    - "images/favicons/*"
    - "images/index.html"
    - "media/*"
    - "pdf/index.html"
    - "pdf/teaching/index.html"
    - "pdf/research/index.html"
    # Things that need to be at the site root
    - "browserconfig.xml"
    - "keybase.txt"
    - "sw.js"

website:
  title: "dfolio' website"
  description: "D. Folio is an associate professor (Dr. Habil) at INSA Centre Val de Loire, researching in microrobotics."
  image: "favicon.svg"
  favicon: "favicon.svg"
  #site-url: https://dfolio.free.fr
  #site-url: https://dfolio.quarto.pub
  site-url: https://dfolio.fr
  repo-url: https://github.com/dfolio/dfolio-website
  search: true

  comments:
    giscus:
      repo: dfolio/dfolio
      loading: lazy

  cookie-consent:
    style: simple
    type: implied
    palette: dark
    policy-url: /about/privacy/

  google-analytics:
    #tracking-id: 'G-P49B92C60B'
    tracking-id: 'G-TVHK4RZ89K'
    version: 4
    anonymize-ip: true

  open-graph:
    locale: en_US
    site-name: "dfolio' website"
    image: "/favicon.svg"

  reader-mode: true
  page-navigation: true

  page-footer:
    border: false
    left: |
        [&copy; 2004&ndash;2023, {{< fa at title="at" >}} [Folio David](/about/about.qmd).]{.copyright aria-label="copyright"}
        [[![](https://i.creativecommons.org/l/by/4.0/80x15.png "Creative Commons License")](http://creativecommons.org/licenses/by/4.0/ "Creative Commons Attribution 4.0 International (CC BY 4.0)")
        Site licensed under]{.d-none .d-lg-inline}
        [[{{< fa brands creative-commons-by title="CC-BY 4.0" >}} CC-BY 4.0](/about/license.qmd "Creative Commons Attribution 4.0 International (CC BY 4.0)")]{.license aria-label="license"}

    right:
      - aria-label: "GitHub"
        icon: github
        href:  https://github.com/dfolio
      - aria-label: "Orcid"
        text: "{{< ai orcid title='orcid' >}}"
        href: https://orcid.org/0000-0001-9430-6091
      - aria-label: "clarivate (webofscience)"
        text: "{{< ai clarivate title='clarivate' >}}"
        href: https://www.webofscience.com/wos/author/record/D-5808-2013
      - aria-label: "Scopus"
        text: "{{< ai scopus >}}"
        href: https://www.scopus.com/authid/detail.uri?authorId=15924858900
      - aria-label: "Google Scholar"
        text: "{{< ai google-scholar title='google scholar' >}}"
        href: https://scholar.google.fr/citations?user=XQVc6JMAAAAJ
      - aria-label: "Academia"
        text: "{{< ai academia >}}"
        href: https://insa-centrevaldeloire.academia.edu/DavidFolio
      - aria-label: "ResearchGate"
        text: "{{< ai researchgate title='researchgate' >}}"
        href: https://www.researchgate.net/profile/David_Folio
      - aria-label: "LinkedIn"
        icon: linkedin
        href: https://www.linkedin.com/in/david-folio/
      - aria-label: "Viadeo"
        icon: link-45deg
        href: https://viadeo.com/fr/profile/david.folio
      - aria-label: "HAL"
        text: "{{< ai hal title='HAL archive ouverte' >}}"
        href: https://cv.hal.science/david-folio
#      - aria-label: "Website"
#        icon: link-45deg
#        href:  http://dfolio.free.fr

  navbar:
    pinned: false
    logo: "favicon.svg"
    logo-alt: "dfolio website logo"
    search: true
    title: false
    collapse-below: lg
    left:
      - text: "About"
        href: about/
      #- sidebar:teaching
      - text: "Teaching"
        href: teaching/teaching.qmd
      #- sidebar:research
      - text: "Research"
        href: research/
      - text: "Publications"
        href: publications/publications.qmd
      - text: "Posts"
        href: posts/index.qmd
    tools:
    #   - icon: save
    #     menu:
    #       - text: ""
    #         url:  "#"
      - icon: github
        href: https://github.com/dfolio
        text: Dfolio GitHub
  sidebar:
    - id: about
      #collapse-level: 1
      title: "Teaching"
      #style: "docked"
      style: "floating"
      contents:
        - about/about.qmd
        - about/dfolio.qmd
        - about/history.qmd
        - about/privacy.qmd
        - about/license.qmd


    - id: teaching
      #collapse-level: 1
      title: "Teaching"
      contents:
        - teaching/teaching.qmd
        - teaching/SFEN.qmd
        - teaching/ELAN.qmd
        - teaching/composants-electroniques.qmd
        - teaching/genie-electrique.qmd
        - teaching/signaux-systemes.qmd
        - teaching/diagnostic-systemes.qmd
        - teaching/advanced-robotic.qmd

    - id: research
      title: "Research"
      collapse-level: 2
      align: left
      contents:
        - research/research.qmd
        - research/supervisions.qmd
        - section: "Projects"
          contents:
          - text: "Projects list"
            href: research/projects/projects.qmd
          - research/projects/BUBBLEBOT.qmd
          - research/projects/MTG.qmd
        - section: "Microrobotics"
          contents:
          -  research/microrobotics/microrobotics.qmd
          - research/microrobotics/biomedical.qmd
        - section: Bibliography
          contents:
            - research/references.qmd
            - publications/publications.qmd
format:
  html:
    minimal: true
    from: markdown+emoji
    date-modified: last-modified
    highlight: null
    mathjax: null
    html-math-method: plain
    theme:
      light: [scss/common.scss,scss/light.scss]
      dark: [scss/common.scss,scss/dark.scss]

    #css: styles.css

    template: html/template.html
    template-partials:
      - html/metadata.html
      - html/title-block.html
      - html/title-metadata.html
      - html/after-body.html
    toc: true
    anchor-sections: true
    code-copy: true
    citations-hover: true
    link-citations: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/dfolio.(?:quarto.pub|free.fr|fr)'
    footnotes-hover: true
    reference-location: document
    strip-comments: true
    smooth-scroll: true

#page-layout: full
#bibliography: [research/references.bib]
csl: research/Thesis-ieee-style.csl
#csl: research/nature-no-et-al.csl
#biblio-style: ieee
#biblatex: true

execute:
  freeze: auto
  echo: false
  message: false
  warning: false

# Metadata stuff
title-prefix: "dfolio' website"
author-meta: "D. FOLIO"
