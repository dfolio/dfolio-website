<footer id="footer-block" class="quarto-footer-block default h-entry">
$if(author)$
<div class="quarto-footer-meta-authors">
<div class="quarto-footer-meta-contents authors">
  <span class="quarto-footer-meta-heading">$labels.authors$</span>:
  <span class="quarto-footer-meta-contents">$for(by-author)$<span class="p-author h-card">$by-author.name.literal$</span>$sep$, $endfor$</span>
</div>
$endif$
<div class="quarto-footer-meta-date">
  <span class="quarto-footer-meta-heading">$labels.published$</span>
  <time class="quarto-footer-meta-contents dt-published" datetime="$date$">$date$</time>
  $if(date-modified)$<span class="quarto-footer-meta-heading">$labels.modified$ $labels.on$</span>
  <time class="quarto-footer-meta-contents date dt-updated" datetime="$date-modified$">$date-modified$</time>$endif$
</div>
</div>
</footer>

$if(scite-badge)$
<script async type="application/javascript" src="https://cdn.scite.ai/badge/scite-badge-latest.min.js"></script>
$endif$
<script type="module">
  const registerServiceWorker = async () => {
  if ('serviceWorker' in navigator) {
    try {
      const registration = await navigator.serviceWorker.register(
        '/sw.js',
        {
          scope: './',
        }
      );
      if (registration.installing) {
        console.log('Service worker installing');
      } else if (registration.waiting) {
        console.log('Service worker installed');
      } else if (registration.active) {
        console.log('Service worker active');
      }
    } catch (error) {
      console.error(`Registration failed with ${error}`);
    }
  }
};

registerServiceWorker();
</script>
