<header id="title-block-header" class="quarto-title-block default" itemprop="headline">
<div class="quarto-title">
  <div class="quarto-title column-body">
  <h1 class="title" itemprop="headline">$title$</h1>
  $if(subtitle)$<p class="subtitle lead">$subtitle$</p>$endif$
  $if(categories)$$if(quarto-template-params.title-block-categories)$
  <div class="quarto-categories">
  $for(categories)$<div class="quarto-category">$categories$</div>$endfor$
  </div>$endif$$endif$
  </div>
</div>

$if(hide-description)$
$elseif(description)$
  <div class="quarto-description"><div class="description p-summary">$description$</div></div>
$endif$

$if(title-block-meta)$
$title-metadata.html()$
$endif$
</header>
