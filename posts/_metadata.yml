adsense: true
# Date format
#date-format: "ddd., MMM. D, YYYY"
date-format: "YYYY-MM-DDTHH:mm:ssZ"

post: true
# Enable banner style title blocks
title-block-banner: true
title-block-meta: true
# Default for table of contents
toc: true
#toc-title: Contents
toc-location: left

minimal: false
highlight-style: github
#highlight-style: pygments
code-copy: true
#code-fold: show
#code-summary: "Toggle the code"
#code-tools: true
#code-line-numbers: true
#code-link: true
#code-overflow: wrap
code-block-background: true
code-block-border-left: true
# Default knitr options
execute:
  freeze: true

engine: knitr
# Default author
author:
  name: David Folio
  orcid: 0000-0001-9430-6091
  #email: david.folio@insa-cvl.fr
  url:  https://dfolio.fr/about/dfolio.html
  alternate: ["dfolio", "David Folio"]
  jobTitle: "Senior associate professor"
  image: "https://dfolio.fr/images/david-folio.webp"

rss: /posts/posts.xml

